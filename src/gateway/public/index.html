<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OMega</title>
  <meta name="description" content="OM: A lightweight, local-first framework for building and running AI agents.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,600&family=Outfit:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=9">
  <link rel="icon" type="image/svg+xml" href="om.svg?v=4">
  <link rel="icon" type="image/png" sizes="512x512" href="om.png?v=4">
  <link rel="icon" type="image/png" sizes="32x32" href="om-32.png?v=4">
  <link rel="shortcut icon" type="image/x-icon" href="om.ico?v=4">
  <link rel="apple-touch-icon" sizes="180x180" href="om.png?v=4">
</head>

<body class="dark-theme arena-theme">
  <div class="app-layout">
    <!-- 1. LEFT ACTIVITY BAR -->
    <aside class="activity-bar">
      <div class="activity-top">
        <div class="lm-logo" aria-label="OMega">
          <img src="om.svg?v=4" alt="OMega" class="om-rail-logo" width="32" height="32">
        </div>
        <nav class="rail-nav">
          <button class="rail-item active" data-tab="chat" aria-label="Chat">
            <svg class="rail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            </svg>
            <span class="rail-tooltip">Chat</span>
          </button>

          <button class="rail-item" data-tab="agents" aria-label="Agents">
            <svg class="rail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="8" width="18" height="12" rx="2"></rect>
              <path d="M12 2v6"></path>
              <circle cx="12" cy="2" r="1"></circle>
              <circle cx="9" cy="14" r="1"></circle>
              <circle cx="15" cy="14" r="1"></circle>
            </svg>
            <span class="rail-tooltip">Agents</span>
          </button>

          <button class="rail-item" data-tab="automations" aria-label="Automations">
            <svg class="rail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9"></circle>
              <polyline points="12 7 12 12 15 15"></polyline>
            </svg>
            <span class="rail-tooltip">Automations</span>
          </button>

          <button class="rail-item" data-tab="models" aria-label="Models">
            <svg class="rail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
              <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
            </svg>
            <span class="rail-tooltip">Models</span>
          </button>

          <button class="rail-item" data-tab="skills" aria-label="Skills">
            <svg class="rail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
            </svg>
            <span class="rail-tooltip">Skills</span>
          </button>

          <button class="rail-item" data-tab="memory" aria-label="Memory">
            <svg class="rail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 4.44-2.54"></path>
              <path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-4.44-2.54"></path>
            </svg>
            <span class="rail-tooltip">Memory</span>
          </button>

          <button class="rail-item" data-tab="system" aria-label="Developer">
            <svg class="rail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="16 18 22 12 16 6"></polyline>
              <polyline points="8 6 2 12 8 18"></polyline>
            </svg>
            <span class="rail-tooltip">Developer</span>
          </button>

          <button class="rail-item" data-tab="device" aria-label="Device">
            <svg class="rail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect>
              <rect x="9" y="9" width="6" height="6"></rect>
              <line x1="9" y1="1" x2="9" y2="4"></line>
              <line x1="15" y1="1" x2="15" y2="4"></line>
              <line x1="9" y1="20" x2="9" y2="23"></line>
              <line x1="15" y1="20" x2="15" y2="23"></line>
              <line x1="20" y1="9" x2="23" y2="9"></line>
              <line x1="20" y1="14" x2="23" y2="14"></line>
              <line x1="1" y1="9" x2="4" y2="9"></line>
              <line x1="1" y1="14" x2="4" y2="14"></line>
            </svg>
            <span class="rail-tooltip">Device</span>
          </button>
        </nav>
      </div>

      <div class="activity-bottom">
        <div class="rail-status-dot-wrap" id="connectionStatus" title="System Status: Connected">
          <span class="status-pulse-dot"></span>
          <span class="status-label" id="statusLabel" style="display:none;">Online</span>
        </div>
      </div>
    </aside>

    <!-- 2. MAIN CONTAINER -->
    <div class="lm-main-container">
      <!-- TOP BAR (Loaded Model Bar + Actions) -->
      <header class="lm-topbar">
        <div class="topbar-left">
          <button class="topbar-icon-btn active" id="toggleSessionsBtn" title="Toggle Sessions Sidebar" type="button">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="9" y1="3" x2="9" y2="21"></line>
            </svg>
          </button>
          <div class="top-title-area">
            <h2 class="view-title" id="viewTitle">Chat</h2>
            <span class="view-tagline" id="viewTagline" style="display:none;">Reasoning, local tool execution, and
              persistent memory</span>
          </div>
          <span class="topbar-session-badge" id="topbarSessionTag" title="Active conversation session"
            style="display: none;">session_1</span>
        </div>

        <!-- Center Topbar: handles kept for state sync -->
        <div class="topbar-center">
          <span id="topLoadedModel" style="display:none;">gemini-3.5-flash</span>
          <span id="topLoadedProvider" style="display:none;">GEMINI</span>
        </div>

        <div class="topbar-right">
          <div class="resource-badge" id="topbarResourcePill" title="Active Tools">
            <span class="res-label">SKILLS</span>
            <span class="res-val" id="skillsCountBadge">0</span>
          </div>

          <button class="topbar-icon-btn" id="toggleParamsBtn" title="Toggle Parameters Sidebar">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="15" y1="3" x2="15" y2="21"></line>
            </svg>
          </button>
        </div>
      </header>

      <!-- CONTENT BODY (Tabs) -->
      <div class="lm-body">

        <!-- TAB 1: CHAT VIEW (LM Studio 3-Column Layout) -->
        <!-- @include partials/pane-chat.html -->
        <!-- @include partials/pane-agents.html -->
        <!-- @include partials/pane-automations.html -->
        <!-- @include partials/pane-models.html -->
        <!-- @include partials/pane-skills.html -->
        <!-- @include partials/pane-memory.html -->
        <!-- @include partials/pane-system.html -->
        <!-- @include partials/pane-device.html -->
      </div>
    </div>
  </div>

  <!-- @include partials/modals.html -->

  <script type="module" src="app.js?v=15"></script>
</body>

</html>
