name: OMega CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-ci:
    name: Linux (Unit, Integration, bwrap & Playwright E2E)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Bubblewrap for live Linux OS sandbox tests
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Install dependencies
        run: npm ci

      - name: Verify docs and badges are in sync
        run: npm run docs:check

      - name: Typecheck internal and public contracts
        run: npm run check:types

      - name: Lint TypeScript sources (zero warnings)
        run: npm run lint

      - name: Run unit & integration suite
        run: npm test

      - name: Run benchmark suite
        run: npm run benchmark

      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium (on cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Install Playwright OS deps (on cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run Playwright UI E2E tests
        run: npm run test:e2e

  cross-os-ci:
    name: ${{ matrix.os }} (Build, Lint & Full Test Suite)
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Lint TypeScript sources (zero warnings)
        run: npm run lint

      - name: Run full unit & integration test suite
        run: npm test

  remote-execution-ci:
    name: Linux (Live Docker & SSH ExecutionBackend E2E)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and build
        run: npm ci && npm run build

      - name: Pull Alpine image for live DockerExecutionBackend E2E
        run: docker pull alpine:latest

      - name: Start ephemeral SSH container for live SSHExecutionBackend E2E
        run: |
          mkdir -p ~/.ssh
          ssh-keygen -t ed25519 -N "" -f ~/.ssh/om_ci_ed25519
          PUB_KEY=$(cat ~/.ssh/om_ci_ed25519.pub)
          docker run -d --rm --name om-ci-sshd \
            -p 2222:2222 \
            -e PUID=1000 \
            -e PGID=1000 \
            -e USER_NAME=omci \
            -e PUBLIC_KEY="$PUB_KEY" \
            lscr.io/linuxserver/openssh-server:latest
          for i in $(seq 1 30); do
            if ssh-keyscan -p 2222 127.0.0.1 >> ~/.ssh/known_hosts 2>/dev/null; then
              break
            fi
            sleep 1
          done

      - name: Run live Docker & SSH ExecutionBackend integration tests
        env:
          OM_SSH_TEST_HOST: omci@127.0.0.1
          OM_SSH_TEST_PORT: "2222"
          OM_SSH_TEST_KEY: ~/.ssh/om_ci_ed25519
          OM_SSH_TEST_WORKDIR: /tmp
        run: node --test tests/remote_integration.test.js

      - name: Cleanup SSH test container
        if: always()
        run: docker rm -f om-ci-sshd || true
